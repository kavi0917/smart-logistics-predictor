name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend - build, ML check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Regenerate dataset and train model (verifies the ML pipeline end to end)
        run: |
          python ml/generate_dataset.py
          python ml/train_model.py
          python ml/evaluate_model.py
      - name: Compile check
        run: python -m compileall -q backend/app ml scripts
      - name: Run backend + ML tests
        working-directory: backend
        run: python -m pytest -v

  frontend:
    name: Frontend - install, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from template
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8000/health | grep -q '"status":"ok"'; then echo "backend healthy"; exit 0; fi
            sleep 3
          done
          docker compose logs backend
          exit 1
      - name: Smoke test (login + prediction)
        run: |
          TOKEN=$(curl -fs -X POST http://localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@logistics.local","password":"Admin@123"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -fs -X POST http://localhost:8000/api/predictions/predict -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"distance_km":50,"traffic_level":"HIGH","weather_condition":"RAIN","vehicle_type":"TRUCK","hour_of_day":15,"day_of_week":2,"warehouse_delay_minutes":10,"previous_route_delay_minutes":5,"promised_delivery_minutes":90}'
          curl -fs -o /dev/null http://localhost:5173
      - name: Stop stack
        if: always()
        run: docker compose down -v

  ready:
    name: Ready for deployment
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - run: echo "All checks passed - commit is ready for deployment."
